<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Who We Are — Wireframes</title>
<link rel="icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #eceae4; font-family: 'Architects Daughter', sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="Wireframes.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    function App() {
      return (
        <DesignCanvas title="Who We Are — wireframes" subtitle="Low-fi structural options for the proposed /about page (History · Team · Board · Partners)">
          <DCSection id="wireframes" title="Three ways to stack it">
            <DCArtboard id="a" label="A — Classic editorial stack" width={1280} height={3600}>
              <OptionA />
            </DCArtboard>
            <DCArtboard id="b" label="B — Manifesto-led, numbers-first" width={1280} height={3400}>
              <OptionB />
            </DCArtboard>
            <DCArtboard id="c" label="C — Tabbed directory" width={1280} height={2100}>
              <OptionC />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
